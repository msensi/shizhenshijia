# 来源注册表（PRD 5.2/5.3；SPEC 第 10 节）
# 开放搜索权威判定依据：域名精确匹配 > 转载作者别名匹配 > 抓正文模型兜底
version: 2

# ── 指定权威站（第二级证据链，include 域名限定用）────────────────
designated_sites:
  - key: piyao
    name: 中国互联网联合辟谣平台
    domain: www.piyao.org.cn
    publisher: 中国互联网联合辟谣平台
    paths:
      - /
      - /bq/index.htm
      - /ld.htm
      - /zt.htm
    use_for: [policy, news, scam]
  - key: kepuchina
    name: 科学辟谣平台（科普中国）
    domain: piyao.kepuchina.cn
    publisher: 科学辟谣平台
    paths:
      - /rumor/rumorlist
      - /rumor/rumordetail
      - /hotlist/hotlist
    use_for: [health, news]
  - key: nhc
    name: 国家卫生健康委员会
    domain: www.nhc.gov.cn
    publisher: 国家卫生健康委员会
    paths:
      - /kppypt/index.shtml
      - /wjw/jkfw/jkfw.shtml
    use_for: [health]

# 交叉转载去重：同机制矩阵内按原始发布主体优先
dedupe_groups:
  - [www.piyao.org.cn, piyao.kepuchina.cn]


# ── 开放搜索采纳分级（PRD 5.3）：后缀泛匹配兜底 ──
# 凡 .gov.cn 一律视为 gov_original（覆盖未单列的部委/省/市/县政府网站）
# 凡 .edu.cn 一律视为 institution（高校/科研机构，需 evidence-v1 二次判断）
qualified_open_web_patterns:
  - suffix: .gov.cn
    tier: gov_original
  - suffix: .edu.cn
    tier: provincial_media

# ── 永不采纳（PRD 5.3）：个人账号、自媒体、营销页、论坛、聚合转载 ──
blocked_domains:
  - baijiahao.baidu.com
  - www.toutiao.com
  - toutiao.com
  - zhihu.com
  - www.zhihu.com
  - tieba.baidu.com
  - baike.baidu.com
  - www.sohu.com/a
  - dy.163.com
  - kuaibao.qq.com
  - new.qq.com/omn
  - www.163.com/dy
  - 3g.k.sohu.com
  - mk.mbd.baidu.com
  - author.baidu.com
  - xueqiu.com
  - www.douban.com
  - www.xiaohongshu.com
  - weibo.com
# 注意：mp.weixin.qq.com 不 block——政务新媒体（健康中国、国家反诈中心等）常以公众号发布，
# 但个人公众号泛滥，默认不合格，仅在抓正文后能确认官方账号主体时才采纳（第三级兜底判断）
